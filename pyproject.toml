[project]
name = "datailor-preference-mcp"
version = "0.1.0"
description = "Local-first personal preference MCP with Markdown store, capture pipeline, injection, and UI"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
datailor = "preference_agent.cli:main"
datailor-mcp = "preference_agent.mcp_server:main"
datailor-kimi-hook = "preference_agent.kimi_hooks:main"
datailor-openclaw-hook = "preference_agent.openclaw_hooks:main"

[tool.setuptools.packages.find]
include = ["preference_agent*"]

[tool.setuptools.package-data]
"preference_agent.ui" = ["static/*"]
"preference_agent.resources" = ["*.md", "openclaw-plugin/*"]
